    const upV = cardValue(state.dealer[0]);
    const needSecond = state.insurance > 0 || state.hands.some(h => !h.busted && !h.surrendered && !(h.natural && (h.evenMoney || (upV !== 10 && upV !== 1))));
    if (needSecond) { await sleep(750); state.dealer.push(draw()); render(); }
    const dBJ = state.dealer.length === 2 && totals(state.dealer).total === 21;
    if (!dBJ && state.hands.some(h => !h.busted && !h.natural && !h.surrendered)) {
      for (;;) {
        const tt = totals(state.dealer);
        if (tt.bust || tt.total > 17 || (tt.total === 17 && !(RULES.dealerHitsSoft17 && tt.soft))) break;
        await sleep(750);
        state.dealer.push(draw());
        render();
      }
    }
    settle(dBJ);
  }
  function settle(dBJ) {
    const dt = totals(state.dealer);
    for (const h of state.hands) {
      let res, pay;
      if (h.surrendered) { res = 'surrender'; pay = h.bet / 2; }
      else if (h.evenMoney) { res = 'even'; pay = 2 * h.bet; }
      else if (h.busted) { res = 'lose'; pay = 0; }
      else if (dBJ) { res = h.natural ? 'push' : 'lose'; pay = h.natural ? h.bet : 0; }
      else if (h.natural) { res = 'bj'; pay = h.bet * (1 + RULES.bjPays); }
      else {
        const pt = totals(h.cards);
        if (dt.bust || pt.total > dt.total) { res = 'win'; pay = 2 * h.bet; }
        else if (pt.total === dt.total) { res = 'push'; pay = h.bet; }
        else { res = 'lose'; pay = 0; }
      }
      h.result = res; h.payout = pay;
      state.balance += pay;
    }
    if (state.insurance > 0) {
      if (dBJ) { state.balance += 3 * state.insurance; state.insuranceResult = 'win'; } else state.insuranceResult = 'lose';
    }
    state.phase = 'result';
    persist();
    render();
  }
  function newRound() {
    state.bet = Math.min(state.lastBet, state.balance);
    state.phase = 'bet';
    state.dealer = []; state.hands = []; state.advice = null;
    render();
  }

  // ---------- rendering ----------
  function cardHTML(c) {
    const red = c.s === '♥' || c.s === '♦';
    const fresh = !state.seen.has(c.id);
    state.seen.add(c.id);
    return `<div class="card${red ? ' red' : ''}${fresh ? ' deal' : ''}" aria-label="${c.r}${c.s}"><span class="idx">${c.r}<i>${c.s}</i></span><span class="pip">${c.s}</span><span class="idx b">${c.r}<i>${c.s}</i></span></div>`;
  }
  function totalText(cards, opts = {}) {
    const tt = totals(cards);
    if (opts.natural) return `<span class="t bj">${t('bj')}</span>`;
    if (tt.bust) return `<span class="t bad">${t('bust', { n: tt.hard })}</span>`;
    if (cards.length === 2 && tt.total === 21 && opts.dealer) return `<span class="t bj">${t('bj')}</span>`;
    return `<span class="t">${tt.total}</span>${tt.soft && tt.total < 21 ? `<span>${t('softTag')}</span>` : ''}`;
  }
  function resultText(h) {
    const net = h.payout - h.bet;
    if (h.result === 'bj') return `<span class="result-tag bj">${t('bj')} +${fmtMoney(net)}</span>`;
    if (h.result === 'surrender') return `<span class="result-tag lose">${t('surrendered')} ${fmtMoney(net)}</span>`;
    if (h.result === 'even') return `<span class="result-tag win">${t('even')} +${fmtMoney(net)}</span>`;
    if (h.result === 'win') return `<span class="result-tag win">+${fmtMoney(net)}</span>`;
    if (h.result === 'push') return `<span class="result-tag push">${t('push')}</span>`;
    return `<span class="result-tag lose">${fmtMoney(net)}</span>`;
  }

  function render() {
    state.advice = computeAdvice();
    $('balance').textContent = fmtMoney(state.balance);
    $('topup').hidden = !(state.phase === 'bet' && state.balance < 5);
    $('hint-mode').value = state.hintMode;

    const showSlot = state.dealer.length === 1 && (state.phase === 'insurance' || state.phase === 'play' || state.phase === 'dealer');
    $('dealer-cards').innerHTML = state.dealer.map(cardHTML).join('') + (showSlot ? `<div class="card slot">${t('slot')}</div>` : '');
    $('dealer-total').innerHTML = state.dealer.length ? totalText(state.dealer, { dealer: true }) : '';

    $('hands').innerHTML = state.hands.map((h, i) => {
      const active = state.phase === 'play' && i === state.active && !h.done;
      const dim = state.phase === 'play' && !active && h.done && !h.natural;
      return `<div class="hand${active ? ' active' : ''}${dim ? ' dim' : ''}" aria-label="${t('handAria', { n: i + 1 })}">
        <div class="cards">${h.cards.map(cardHTML).join('')}</div>
        <div class="meta">${state.hands.length > 1 ? `<span>${i + 1}.</span>` : ''}${totalText(h.cards, { natural: h.natural })}
          <span class="chip small">${fmtMoney(h.bet)}</span>${h.doubled ? '<span>×2</span>' : ''}
          ${state.phase === 'result' ? resultText(h) : ''}</div>
      </div>`;
    }).join('');

    renderMessage();
    renderControls();
    renderAdvisor();
  }

  function renderMessage() {
    const m = $('message');
    switch (state.phase) {
      case 'bet': m.innerHTML = state.balance < 5 ? t('msgEmpty') : t('msgBet'); break;
      case 'insurance': m.innerHTML = offerIsEvenMoney()
        ? t('msgEven', { x: fmtMoney(state.hands[0].bet) })
        : t('msgIns', { x: fmtMoney(state.hands[0].bet / 2) }); break;
      case 'play': {
        const h = state.hands[state.active];
        m.innerHTML = h.natural ? t('msgBJ') : (state.hands.length > 1 ? t('msgHandTurn', { n: state.active + 1 }) : t('msgTurn'));
        break;
      }
      case 'dealer': m.innerHTML = t('msgDealer'); break;
      case 'result': {
        const dt = totals(state.dealer);
        const dBJ = state.dealer.length === 2 && dt.total === 21;
        const d = dBJ ? t('dBJ') : dt.bust ? t('dBust', { n: dt.hard }) : state.dealer.length === 1 ? t('dNoSecond') : t('dTotal', { n: dt.total });
        const net = state.hands.reduce((s, h) => s + h.payout - h.bet, 0) + (state.insuranceResult === 'win' ? 2 * state.insurance : state.insuranceResult === 'lose' ? -state.insurance : 0);
        const ins = state.insuranceResult ? (state.insuranceResult === 'win' ? t('insWon', { x: fmtMoney(2 * state.insurance) }) : t('insLost', { x: fmtMoney(state.insurance) })) : '';
        m.innerHTML = t('msgResult', { d, ins, net: (net > 0 ? '+' : '') + fmtMoney(net) });
        break;
      }
    }
  }

  // one-line verdict of the last decision, for the tip line in "after" mode
  function verdictLine() {
    const f = state.feedback;
    if (!f || state.hintMode !== 'after') return '';
    const ok = f.cost <= 1e-9;
    if (f.customKey) {
      const chosen = f.customKey === 'emTaken' ? t('even') : f.customKey === 'emWait' ? t('tipWait') : f.customKey === 'insTaken' ? t('insTitle') : t('tipNoIns');
      return `<span class="${ok ? 'ok' : 'miss'}">${ok ? t('tipOk', { action: chosen }) : t('tipMiss', { best: f.customKey === 'emTaken' ? t('tipWait') : t('tipNoIns'), cost: fmtPct(f.cost) })}</span>`;
    }
    return `<span class="${ok ? 'ok' : 'miss'}">${ok ? t('tipOk', { action: name(f.action) }) : t('tipMiss', { best: lower(name(f.best)), cost: fmtPct(f.cost) })}</span>`;
  }

  function renderControls() {
    const c = $('controls');
    const a = state.advice;
    if (state.phase === 'bet') {
      c.innerHTML = `<div class="bet-now">${t('betNow')} <b>${fmtMoney(state.bet)}</b></div>
        <div class="bet-chips">${CHIPS.map(v => `<button type="button" data-chip="${v}" ${state.bet + v > state.balance ? 'disabled' : ''} aria-label="${t('addChip', { v })}"><span class="chip c${v}">${v}</span></button>`).join('')}
          <button class="ghost" type="button" data-act="clear" style="color:var(--table-ink);border-color:rgba(255,255,255,.4)">${t('clear')}</button></div>
        <div class="row"><button class="btn primary" type="button" data-act="deal" ${state.bet <= 0 || state.bet > state.balance ? 'disabled' : ''}>${t('deal')}</button></div>`;
    } else if (state.phase === 'insurance' && offerIsEvenMoney()) {
      const em = evenMoneyAdvice();
      c.innerHTML = `<div class="tip">${state.hintMode === 'live' ? `${t('tipAdvisor')} <b>${t('tipWait')}</b> <small>· ${t('tipWaitDetail', { w: fmtPct(em.wait), e: fmtPct(1) })}</small>` : ''}</div>
        <div class="row"><button class="btn" type="button" data-act="ins-no">${t('waitBtn')}</button><button class="btn" type="button" data-act="ins-yes">${t('evenBtn', { x: fmtMoney(state.hands[0].bet) })}</button></div>`;
    } else if (state.phase === 'insurance') {
      const ia = insuranceAdvice();
      c.innerHTML = `<div class="tip">${state.hintMode === 'live' ? `${t('tipAdvisor')} <b>${t('tipNoIns')}</b> <small>· ${t('tipInsDetail', { ev: fmtPct(ia.ev) })}</small>` : ''}</div>
        <div class="row"><button class="btn" type="button" data-act="ins-no">${t('noInsBtn')}</button><button class="btn" type="button" data-act="ins-yes" ${state.balance < state.hands[0].bet / 2 ? 'disabled' : ''}>${t('insBtn', { x: fmtMoney(state.hands[0].bet / 2) })}</button></div>`;
    } else if (state.phase === 'play') {
      const h = state.hands[state.active];
      const rec = (k) => state.hintMode === 'live' && a && a.best === k ? ' rec' : '';
      let tip = '';
      if (state.hintMode === 'live' && a) {
        const order = Object.entries(a.evs).sort((x, y) => y[1] - x[1]);
        tip = `${t('tipAdvisor')} <b>${name(a.best)}</b> ${fmtPct(a.evs[a.best])}` +
          (order.length > 1 ? ` <small>· ${order.filter(([k]) => k !== a.best).slice(0, 2).map(([k, v]) => lower(name(k)) + ' ' + fmtPct(v)).join(', ')}</small>` : '');
      } else if (state.hintMode === 'after') {
        tip = verdictLine();
      }
      c.innerHTML = `<div class="tip">${tip}</div><div class="row">
        <button class="btn hit${rec('hit')}" type="button" data-act="hit"><span class="k">H</span>${name('hit')}</button>
        <button class="btn stand${rec('stand')}" type="button" data-act="stand"><span class="k">S</span>${name('stand')}</button>
        <button class="btn double${rec('double')}" type="button" data-act="double" ${canDouble(h) && state.balance >= h.bet ? '' : 'disabled'}><span class="k">D</span>${name('double')}</button>
        <button class="btn split${rec('split')}" type="button" data-act="split" ${canSplit(h) && state.balance >= h.bet ? '' : 'disabled'}><span class="k">P</span>${name('split')}</button>
        <button class="btn surrender${rec('surrender')}" type="button" data-act="surrender" ${canSurrender(h) ? '' : 'disabled'}><span class="k">R</span>${name('surrender')}</button>
      </div>`;
    } else if (state.phase === 'dealer') {
      c.innerHTML = `<div class="tip">${verdictLine()}</div>`;
    } else {
      c.innerHTML = `<div class="tip">${verdictLine()}</div><div class="row"><button class="btn primary" type="button" data-act="new" ${state.balance < 5 ? 'disabled' : ''}>${t('newRound')}</button><button class="btn" type="button" data-act="change">${t('changeBet')}</button></div>`;
    }
  }

  function barsHTML(evs, best, infeasible = {}) {
    const entries = Object.entries(evs).sort((a, b) => b[1] - a[1]);
    const scale = Math.max(0.25, ...entries.map(e => Math.abs(e[1])));
    return `<ul class="bars">` + entries.map(([k, v]) => {
      const pct = Math.abs(v) / scale * 50, left = v < 0 ? 50 - pct : 50;
      return `<li class="${k === best ? 'best' : ''}${infeasible[k] ? ' no' : ''}"><span class="name">${name(k)}${infeasible[k] ? ' <small>(' + t(infeasible[k]) + ')</small>' : ''}</span>` +
        `<span class="track"><span class="zero"></span><span class="fill ${v < 0 ? 'neg' : 'pos'}" style="left:${left}%;width:${pct}%"></span></span><span class="val">${fmtPct(v)}</span></li>`;
    }).join('') + `</ul>`;
  }

  function renderAdvisor() {
    const adv = $('advice');
    const a = state.advice;
    const curTitle = (label, up) => `${t('curHand')} · ${labelText(label)} ${t('vs')} ${up}`;
    if (state.hintMode === 'off') {
      adv.innerHTML = `<span class="t">${t('curHand')}</span><p class="note">${t('offNote')}</p>`;
    } else if (state.phase === 'insurance' && offerIsEvenMoney()) {
      const em = evenMoneyAdvice();
      adv.innerHTML = `<span class="t">${t('evenTitle')}</span>
        <div class="verdict"><span class="sw a-S">–</span><span><b>${t('evenVerdict')}</b><small>${t('evenSub', { w: fmtPct(em.wait), e: fmtPct(1) })}</small></span></div>
        <p class="note">${t('evenNote', { p: (em.p * 100).toFixed(1).replace('.', dec()) + ' %' })}</p>`;
    } else if (state.phase === 'insurance') {
      const ia = insuranceAdvice();
      adv.innerHTML = `<span class="t">${t('insTitle')}</span>
        <div class="verdict"><span class="sw a-S">–</span><span><b>${t('insVerdict')}</b><small>${t('insSub', { ev: fmtPct(ia.ev) })}</small></span></div>
        <p class="note">${t('insNote', { p: (ia.p * 100).toFixed(1).replace('.', dec()) + ' %' })}</p>`;
    } else if (state.phase === 'play' && a) {
      if (state.hintMode === 'after') {
        adv.innerHTML = `<span class="t">${curTitle(a.label, a.up)}</span><p class="note">${t('afterNote')}</p>`;
      } else {
        const order = Object.entries(a.evs).sort((x, y) => y[1] - x[1]);
        const runner = order.find(([k]) => k !== a.best);
        const margin = runner ? a.evs[a.best] - runner[1] : 0;
        adv.innerHTML = `<span class="t">${curTitle(a.label, a.up)}</span>
          <div class="verdict"><span class="sw a-${LETTERS[a.best]}">${LETTERS[a.best]}</span><span><b>${name(a.best)}</b>${a.bestAll !== a.best ? `<small>${t('bestInfeasible', { best: lower(name(a.bestAll)), reason: t(a.infeasible[a.bestAll]) })}</small>` : ''}</span></div>
          ${barsHTML(a.evs, a.best, a.infeasible)}
          <p class="note">${t('margin', { m: fmtPct(margin), close: margin < 0.01 ? t('marginClose') : '' })}</p>`;
      }
    } else if (state.phase === 'play' && state.hands[state.active] && state.hands[state.active].natural) {
      adv.innerHTML = `<span class="t">${t('curHand')}</span><p class="note">${t('naturalNote')}</p>`;
    } else if (state.phase === 'bet') {
      adv.innerHTML = `<span class="t">${t('curHand')}</span><p class="note">${t('betNote')}</p>`;
    } else {
      adv.innerHTML = `<span class="t">${t('curHand')}</span><p class="note">${state.phase === 'dealer' ? t('dealerNote') : t('doneNote')}</p>`;
    }

    const fb = $('feedback');
    const f = state.feedback;
    if (f && state.hintMode !== 'off') {
      const ok = f.cost <= 1e-9;
      fb.hidden = false;
      let text;
      if (f.customKey) {
        const vars = {}; for (const [k, fn] of Object.entries(f.vars)) vars[k] = fn();
        text = t(f.customKey, vars);
      } else {
        text = ok ? t('fbOk', { action: name(f.action) })
          : t('fbMiss', { action: lower(name(f.action)), ev: fmtPct(f.evs[f.action]), best: lower(name(f.best)), bev: fmtPct(f.evs[f.best]), cost: fmtPct(f.cost) });
      }
      const label = labelText(f.label) + (f.customKey ? '' : ` ${t('vs')} ${f.up}`);
      fb.innerHTML = `<span class="t">${t('lastDecision', { label })}</span>
        <div class="feedback"><span class="mark ${ok ? 'ok' : 'miss'}">${ok ? '✓' : '✗'}</span><p>${text}</p></div>
        ${state.hintMode === 'after' && f.evs ? barsHTML(f.evs, f.best, f.infeasible) : ''}`;
    } else { fb.hidden = true; fb.innerHTML = ''; }

    const s = state.stats;
    const acc = s.decisions ? Math.round(100 * s.correct / s.decisions) : 0;
    $('stats').innerHTML = `<div class="stat"><span class="n">${s.decisions}</span><span class="l">${t('stDecisions')}</span></div>
      <div class="stat"><span class="n">${acc} %</span><span class="l">${t('stCorrect')}</span></div>
      <div class="stat"><span class="n">${(s.evLost * 100).toFixed(1).replace('.', dec())} %</span><span class="l">${t('stLost')}</span></div>`;
    $('stats-note').textContent = s.decisions ? t('statsNote') : t('statsNone');
  }

  function applyLanguage() {
    document.documentElement.lang = lang;
    document.title = t('title');
    document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.dataset.i18n); });
    document.querySelectorAll('.lang-switch button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    render();
  }

  // ---------- events ----------
  $('controls').addEventListener('click', (e) => {
    const chip = e.target.closest('button[data-chip]');
    if (chip) { const v = +chip.dataset.chip; if (state.bet + v <= state.balance) { state.bet += v; render(); } return; }
    const b = e.target.closest('button[data-act]');
    if (!b || b.disabled) return;
    const act = b.dataset.act;
    if (act === 'deal') deal();
    else if (act === 'clear') { state.bet = 0; render(); }
    else if (act === 'ins-yes') answerOffer(true);
    else if (act === 'ins-no') answerOffer(false);
    else if (act === 'new') { newRound(); if (state.bet > 0) deal(); }
    else if (act === 'change') newRound();
    else if (['hit', 'stand', 'double', 'split', 'surrender'].includes(act)) window.requestAnimationFrame(() => actWith(act));
  });
  function actWith(action) { act(action); }
  $('hint-mode').addEventListener('change', (e) => { state.hintMode = e.target.value; persist(); render(); });
  $('reset-stats').addEventListener('click', () => { state.stats = { decisions: 0, correct: 0, evLost: 0 }; state.feedback = null; persist(); render(); });
  $('topup').addEventListener('click', () => { state.balance += 1000; state.bet = Math.min(state.lastBet, state.balance); persist(); render(); });
  document.querySelectorAll('.lang-switch button').forEach(b => b.addEventListener('click', () => {
    lang = b.dataset.lang;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) { /* ignore */ }
    applyLanguage();
  }));
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'SELECT' || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (state.phase === 'play') {
      const map = { h: 'hit', s: 'stand', d: 'double', p: 'split', r: 'surrender' };
      if (map[k]) { e.preventDefault(); actWith(map[k]); }
    } else if (state.phase === 'bet' && e.key === 'Enter') { e.preventDefault(); deal(); }
    else if (state.phase === 'result' && e.key === 'Enter') { e.preventDefault(); newRound(); if (state.bet > 0) deal(); }
    else if (state.phase === 'insurance' && (k === 'n' || e.key === 'Enter')) { e.preventDefault(); answerOffer(false); }
    else if (state.phase === 'insurance' && k === 'y') { e.preventDefault(); answerOffer(true); }
  });

  // test hook for local runs only: __bj.rig([{r:'A'},{r:'K'},{r:'A'}]) rigs the next deal
  // (dealer up card first, then the player's two cards, then further draws)
  if (location.protocol !== 'https:') window.__bj = { state, act, rig: (cards) => { state.rigged = cards; }, setLang: (l) => { lang = l; applyLanguage(); } };
  // inside the desktop app the table is bundled next to the game
  if (location.protocol === 'bjapp:') $('table-link').href = 'bjapp://app/strategija.html';

  state.bet = Math.min(state.lastBet, state.balance);
  applyLanguage();
})();
</script>
